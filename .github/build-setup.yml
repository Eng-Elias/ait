# Steps spliced into every build-local-artifacts job by dist's
# `github-build-setup` (Cargo.toml [workspace.metadata.dist]),
# immediately after actions/checkout — i.e. before the generated
# "Install dependencies" step. Keep `run:` blocks literal (`|`):
# dist's splicer mangles folded/chomped scalars.
#
# Why this exists: the runner image routes apt through *.ubuntu.com
# sources that can all fail DNS resolution at once — v1.0.0's musl leg
# died twice at `apt-get install musl-tools` (~20 min apart), and the
# same outage took down the promotion CI. scripts/fix-apt-mirror.sh
# repoints apt at kernel.org's mirror and warms the indexes; the
# pre-install then makes dist's own `apt-get install musl-tools` a
# no-op ("0 newly installed") even if apt flakes again.
- name: Repoint apt off dead ubuntu.com mirrors and pre-install musl deps
  if: ${{ contains(matrix.targets, 'x86_64-unknown-linux-musl') }}
  run: |
    sh scripts/fix-apt-mirror.sh
    sudo apt-get -o Acquire::Retries=3 install -y musl-tools
