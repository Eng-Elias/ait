name: CI

# Actions-minute budget (private repo): CI exists for `main` only —
# the dev→main promotion PR and the post-merge push. Every check
# during development is local via scripts/check.sh (see AGENTS.md);
# PRs to `dev` never trigger this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is not a default type — without it, un-drafting
    # a promotion PR would never fire CI.
    types: [opened, synchronize, reopened, ready_for_review]

# A superseded run keeps billing to completion; cancel it when a newer
# push lands on the same ref/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `push` has no pull_request payload — gate drafts, keep pushes.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pin lives in rust-toolchain.toml (exact version — local and
      # CI can never disagree on the clippy/fmt version); the action
      # needs it as an input, so read the channel out of the file.
      - name: Read toolchain pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      # All three jobs share one cargo/target cache (`shared-key`) —
      # cold workspace builds are where the billed minutes go.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # R09 retro: ait-shell's snippet tests (tests/remote.rs) exec the
      # committed snippets/{bash,zsh,fish} against a stub ssh and skip a
      # shell's leg silently when it isn't installed — install them so
      # `cargo test --workspace` covers all three here too, not just in
      # the e2e job. apt's *.ubuntu.com sources are repointed first —
      # they can all fail DNS at once on GH runners (see
      # scripts/fix-apt-mirror.sh).
      - name: Install zsh and fish
        run: sh scripts/fix-apt-mirror.sh && sudo apt-get -o Acquire::Retries=3 install -y zsh fish

      - name: Test
        run: cargo test --workspace

      # ADR-0002: every Cargo.toml dep documents its resolved version +
      # release date in a comment block.
      - name: Dependency release-date comments
        run: python3 scripts/check-dep-comments.py

      # Debug scaffolding (dbg!, print macros outside main.rs, AIT_DEBUG*
      # probes) stays out of crates/*/src — main.rs keeps eprintln! as
      # the CLI's own stderr.
      - name: Source hygiene
        run: scripts/check-src-hygiene.sh

      # std.15's mechanical floor: a substring probe whose literal also
      # appears mid-line inside a typed-input literal keys on the
      # shell's echo, not the command's output.
      - name: E2E sentinel probes
        run: python3 scripts/check-e2e-sentinels.py

  # The e2e suite (Spec E01): the real `ait` binary in a real PTY plus
  # the testkit's own PTY self-tests. Needs no TTY and no network (§6) —
  # `portable-pty` provides the terminal. Failure dumps under
  # `target/e2e-failures/` are uploaded when the suite fails.
  e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Spec R05 §5.5: the shell-integration e2e matrix gates on
      # installed shells — install them so it covers all three rather
      # than silently running bash-only. Same apt mirror repoint as
      # the check job — *.ubuntu.com sources can all fail DNS at once
      # (see scripts/fix-apt-mirror.sh).
      - name: Install zsh and fish
        run: sh scripts/fix-apt-mirror.sh && sudo apt-get -o Acquire::Retries=3 install -y zsh fish

      - name: Build
        run: cargo build -p ait

      # tests/mcp_skills.rs spawns ait-agent's committed `mcp_fixture`
      # example as the stdio MCP server — `-p ait` doesn't build a
      # dependency's examples, so build it explicitly.
      - name: Build the mcp_fixture example
        run: cargo build -p ait-agent --example mcp_fixture

      - name: E2E tests
        run: cargo test -p ait -p ait-testkit

      - name: Upload failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: target/e2e-failures/
          if-no-files-found: ignore

  # Spec R15: the GUI e2e suite — the real `ait-gui` binary under a
  # virtual display, driven over its test-driver socket and asserted
  # on the structured dump. Both binary legs run: `web`+`test-driver`
  # (embedded webview — needs the webkit2gtk-4.1/gtk/soup dev packages
  # the release legs currently get nowhere else) and
  # `--no-default-features`+`test-driver` (external-open surface, no
  # webkit). Each spawn wraps itself in `xvfb-run -a`, so the job needs
  # no outer display; `mesa-vulkan-drivers` supplies lavapipe, the
  # software adapter `WGPU_ADAPTER_NAME` pins so wgpu can never grab a
  # headless-unusable device. `xdotool` is only for the winit canary
  # (AIT_GUI_E2E_XTEST) — an XTest probe that real input reaches winit,
  # non-authoritative by design. Failure dumps land under
  # `target/e2e-failures/` like the PTY suite's.
  gui-e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Same apt mirror repoint as the other jobs — *.ubuntu.com
      # sources can all fail DNS at once (scripts/fix-apt-mirror.sh).
      - name: Install display, GPU, input and webkit tooling
        run: |
          sh scripts/fix-apt-mirror.sh
          sudo apt-get -o Acquire::Retries=3 install -y \
            xvfb mesa-vulkan-drivers xdotool \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # `ctl_and_driver_sockets_coexist` wants an `ait` sibling for
      # its `ait ctl` legs — nearly free under the shared cache.
      - name: Build ait and the web-leg ait-gui
        run: |
          cargo build -p ait
          cargo build -p ait-gui --features test-driver
          cp target/debug/ait-gui target/ait-gui-web

      # The noweb leg shares the target dir — its build replaces
      # target/debug/ait-gui, so the web binary was copied aside
      # first. --no-default-features needs none of the webkit stack.
      - name: Build the noweb-leg ait-gui
        run: |
          cargo build -p ait-gui --no-default-features --features test-driver
          cp target/debug/ait-gui target/ait-gui-noweb

      # One pass covers every scenario leg: the cargo-built binary
      # answers `any`/`web`, AIT_GUI_E2E_BIN_NOWEB points at the copy.
      # Each spawn owns its display (xvfb-run -a); the canary raises
      # its own private Xvfb. WGPU_* pins wgpu to lavapipe — under
      # Xvfb no DRI device is usable even if a real-GPU ICD is
      # installed.
      - name: GUI e2e suite
        env:
          AIT_GUI_E2E_BIN_NOWEB: ${{ github.workspace }}/target/ait-gui-noweb
          AIT_GUI_E2E_XTEST: "1"
          WGPU_ADAPTER_NAME: llvmpipe
          WGPU_BACKEND: vulkan
        run: cargo test -p ait-gui --features test-driver

      - name: Upload failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-e2e-failures
          path: target/e2e-failures/
          if-no-files-found: ignore

  # Spec R09 §5.9: the AIT_E2E_SSH-gated suite (tests/ssh.rs — the real
  # remote loop end to end) runs nowhere else in CI. ubuntu-latest has
  # docker, so scripts/ssh-e2e.sh provisions its throwaway sshd
  # container and tears it down itself.
  ssh-e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Build
        run: cargo build -p ait

      - name: SSH e2e against a throwaway sshd container
        run: scripts/ssh-e2e.sh run

  # Spec R16 §5.14: the Windows leg. `cargo build --workspace
  # --all-targets` proves the whole tree compiles under
  # x86_64-pc-windows-msvc and `cargo test --workspace` runs every
  # non-unix-gated unit/integration test — the unix-only surface is
  # `#[cfg(unix)]`-gated, not deleted. fmt, clippy, dep-comment and
  # hygiene stay on ubuntu (one lint leg is enough; the toolchain pin
  # is shared).
  windows:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same rust-toolchain.toml pin as the unix legs — read with Git
      # Bash (`sed`); the job's default run shell is pwsh.
      - name: Read toolchain pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # Spec R16 §5.14: the e2e suite's Windows variant. `cargo test -p
  # ait -p ait-testkit` runs the PTY suite — the `platforms` scenario
  # gate skips the unix fixtures loudly and runs the Windows-capable
  # subset: the config-*/version legs plus shell-integration-pwsh
  # (PowerShell 7 ships on the runner), shell-integration-winps (the
  # boxed Windows PowerShell 5.1) and shell-degrade-cmd (cmd.exe, the
  # no-injection family). No xvfb, no display — ConPTY supplies the
  # terminal.
  windows-e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Build
        run: cargo build -p ait

      - name: E2E tests
        run: cargo test -p ait -p ait-testkit

      - name: Upload failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-failures
          path: target/e2e-failures/
          if-no-files-found: ignore
