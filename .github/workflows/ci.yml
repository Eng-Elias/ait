name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml (exact pin — local and
      # CI can never disagree on the clippy/fmt version).
      - uses: dtolnay/rust-toolchain@master

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The e2e suite (Spec E01): the real `ait` binary in a real PTY plus
  # the testkit's own PTY self-tests. Needs no TTY and no network (§6) —
  # `portable-pty` provides the terminal. Failure dumps under
  # `target/e2e-failures/` are uploaded when the suite fails.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same rust-toolchain.toml pin as the check job.
      - uses: dtolnay/rust-toolchain@master

      - name: Build
        run: cargo build -p ait

      - name: E2E tests
        run: cargo test -p ait -p ait-testkit

      - name: Upload failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: target/e2e-failures/
          if-no-files-found: ignore
