[package]
name = "ait-config"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AIT's settings.toml model: typed Settings, validation, and errors that name the offending key (REQUIREMENTS.md §4)."

[dependencies]
# Semver requirements; the resolved releases are >=7 days old per the
# ADR-0002 supply-chain rule: serde 1.0.229 (2026-07-18), toml 1.1.8
# (2026-10-09), serde_path_to_error 0.1.20 (2025-09-15),
# schemars 1.2.3 (2026-10-12), serde_json 1.0.154 (2026-10-11),
# keyring 4.2.0 (2026-08-29), uuid 1.28.0 (2026-10-10),
# notify 8.2.0 (2025-08-03), regex 1.13.1 (2026-07-15),
# thiserror 2.0.21 (2026-09-23).
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_path_to_error = "0.1"
# `Settings::validate` compiles every `command_allowlist`/
# `command_denylist` entry (§5.7) so a broken pattern fails at load
# naming its own key path — `regex` is the same engine ait-agent's
# permission engine matches through.
regex = "1"
# `schema` feature: `JsonSchema` derives on the settings model back
# `--print-schema` (REQUIREMENTS.md §4); serde_json renders the schema.
schemars = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# `secrets` feature: OS keyring lookups behind the `SecretStore` seam —
# service "ait", account "<endpoint-key>" (§4.1, user stories 19–20).
# Default `v1` feature set: platform stores incl. zbus Secret Service on
# Linux.
keyring = { version = "4", optional = true }
# `--init`'s template embeds a fresh v4 UUID as the example model's
# `config_key` so it is immediately valid (user story 4). A semver "1"
# requirement resolves uuid 1.29.0 (2026-10-23) — too fresh for
# ADR-0002 — so Cargo.lock is pinned back to 1.28.0 via
# `cargo update -p uuid --precise 1.28.0`.
uuid = { version = "1", features = ["v4"] }
# `watch` feature: hot reload watches the settings file's PARENT directory
# (non-recursive) so editor atomic saves — write temp + rename — still fire
# (Spec R03, user stories 10–11). A semver "8" requirement resolves
# notify 8.2.1 (2026-10-25) — too fresh for ADR-0002 — so Cargo.lock is
# pinned back to 8.2.0 via `cargo update -p notify --precise 8.2.0`.
notify = { version = "8", optional = true }
thiserror = "2"

[features]
# One feature per heavy dep area (R05-T8 audit, issue #77): the `ait`
# binary enables `schema` + `watch`; `ait-agent` (and the binary through
# it) enables `secrets`.
schema = ["dep:schemars", "dep:serde_json"]
secrets = ["dep:keyring"]
watch = ["dep:notify"]

[dev-dependencies]
# The integration tests exercise all three feature areas; the self
# dev-dependency turns them on for `cargo test` builds only — the same
# trick ait-llm uses for `test-fixtures`.
ait-config = { path = ".", features = ["schema", "secrets", "watch"] }
# Tempdirs for the load/secret tests' env-override fixtures.
# Release >=7 days old per ADR-0002: tempfile 3.27.0 (2026-03-11).
tempfile = "3"
