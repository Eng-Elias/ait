[package]
name = "ait-testkit"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Test-only e2e harness: spawns programs in a real PTY via ait-term's LiveSession and asserts on the rendered grid."

[dependencies]
ait-term = { path = "../ait-term" }
# Semver requirements; the resolved releases are >=7 days old per the
# ADR-0002 supply-chain rule: serde 1.0.229 (2026-07-18), serde_json
# 1.0.154 (2026-10-11). Both serialize recordings/ScreenState to jsonl.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Semver requirements; the resolved releases are >=7 days old per the
# ADR-0002 supply-chain rule: toml 1.1.8 (2026-10-09) parses scenario
# files, regex 1.13.1 (2026-07-15) backs the expect_regex verb.
toml = "1"
regex = "1"
# The GUI harness's driver-socket transport — the same `interprocess`
# local sockets `ait_app::ipc` binds (the crate boundary keeps no
# shared code between server and client, like `ENV_DRIVER_SOCKET`).
# Exact pin of a >=7-day-old release per ADR-0002: interprocess 2.4.7
# (2026-10-23).
interprocess = "=2.4.7"
