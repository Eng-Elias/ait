[package]
name = "ait-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shell integration: bash/zsh/fish rc snippets, the injection planner, and the OSC 7700-series hook/in-band-exec codec (REQUIREMENTS.md §5.5)."

[dependencies]
# Semver requirement; the resolved release is >=7 days old per the ADR-0002
# supply-chain rule: serde_json 1.0.154 (2026-10-11) — hook payloads arrive
# as hex-encoded JSON on OSC 7700 (§5.5, ADR-0008).
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# libc 0.2.191 (2026-10-16), already in the tree via `ait-term` —
# `getuid` for `ssh_control_dir`'s per-user `/tmp` fallback name
# (nothing else from the crate is used).
libc = "0.2"

[dev-dependencies]
# Release >=7 days old per ADR-0002: tempfile 3.27.0 (2026-03-11) —
# `ssh_control_dir`'s XDG runtime-dir test root.
tempfile = "3"
