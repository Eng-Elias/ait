[package]
name = "ait"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AIT's TUI binary: a full-screen terminal frontend over ait-term sessions."

[dependencies]
ait-term = { path = "../ait-term" }
# Settings.toml load/watch, the `--init` template, the `--print-schema`
# schema and base_model resolution (Spec R03, user stories 1–14, 24).
ait-config = { path = "../ait-config" }
# Semver requirements per Spec R02; chosen releases are >=7 days old
# (ADR-0002 supply-chain rule): ratatui 0.30.2 (2026-06-19),
# crossterm 0.29.0 (2025-04-05).
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
] }
# `osc52` gives `crossterm::clipboard::CopyToClipboard` — our own host
# clipboard writes (R02-T3). It does NOT touch child-app OSC 52, which
# stays off in ait-term's `SessionOptions`.
crossterm = { version = "0.29", features = ["osc52"] }

[dev-dependencies]
# Test-only e2e harness over ait-term's LiveSession (Spec E01) — never a
# dependency of any product crate.
ait-testkit = { path = "../ait-testkit" }
# Semver requirement per Spec E01; the release is >=7 days old
# (ADR-0002 supply-chain rule): insta 1.49.0 (2026-10-03).
insta = "1.49"
# Tempdirs for the CLI tests' XDG_CONFIG_HOME fixtures (Spec R03:
# `ait --init` writes under a fresh config dir). Release >=7 days old
# per ADR-0002: tempfile 3.27.0 (2026-03-11).
tempfile = "3"
