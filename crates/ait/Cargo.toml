[package]
name = "ait"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AIT's TUI binary: a full-screen terminal frontend over ait-term sessions."
# cargo-dist (Spec R12 §5.11) requires the source host to compute the
# release artifact URLs for the shell installer.
repository = "https://github.com/Eng-Elias/ait"

[dependencies]
ait-term = { path = "../ait-term" }
# Spec R13 §5.12: the frontend-agnostic session model — tabs, blocks,
# the agent panel's state, pickers, ctl, the headless driver and the
# keymap. `ait` keeps only the TUI loop, the crossterm→ait_term key
# translation and the ratatui paint.
ait-app = { path = "../ait-app" }
# Settings.toml load/watch, the `--init` template, the `--print-schema`
# schema and base_model resolution (Spec R03, user stories 1–14, 24).
# `watch` adds hot reload (us-10–11) and `schema` the `--print-schema`
# JSON Schema; `secrets` (OsKeyring) arrives via ait-agent.
ait-config = { path = "../ait-config", features = ["schema", "watch"] }
# Spec R04 NL→command: the `# `+Enter trigger fires a `SuggestRequest`
# into ait-agent's channel-based `CommandSuggester` (user stories 1–2,
# 13–17, 29). ait-agent owns its tokio runtime on a worker thread, so
# `ait` never gains a tokio dependency (ADR-0004, amended 2026-10-28 —
# the runtime landed in the library crates, not the `ait` binary the
# original text reserved it for).
ait-agent = { path = "../ait-agent" }
# Semver requirements per Spec R02; chosen releases are >=7 days old
# (ADR-0002 supply-chain rule): ratatui 0.30.2 (2026-06-19),
# crossterm 0.29.0 (2025-04-05).
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
] }
# `osc52` gives `crossterm::clipboard::CopyToClipboard` — our own host
# clipboard writes (R02-T3). It does NOT touch child-app OSC 52, which
# stays off in ait-term's `SessionOptions`.
crossterm = { version = "0.29", features = ["osc52"] }
# Spec R13 §5.12's binary shape: `ait gui`/`ait --gui` launches the GUI
# frontend in-process — optional and OFF by default, so
# `cargo build -p ait` carries zero GUI dependencies (us-23). Local
# builds opt in with `--features gui`; the packaged GUI is the
# `ait-gui` binary and release builds never enable this.
ait-gui = { path = "../ait-gui", optional = true }

[features]
# The `dep:` reference suppresses the implicit `ait-gui` feature —
# `gui` is the only switch (Spec R13 §5.12: default off, never on in
# dist builds).
gui = ["dep:ait-gui"]

[dev-dependencies]
# Test-only e2e harness over ait-term's LiveSession (Spec E01) — never a
# dependency of any product crate.
ait-testkit = { path = "../ait-testkit" }
# Semver requirement per Spec E01; the release is >=7 days old
# (ADR-0002 supply-chain rule): insta 1.49.0 (2026-10-03);
# serde_json 1.0.154 (2026-10-11) — the app tests serialize
# `TranscriptItem`s into the stored payloads they stage.
insta = "1.49"
# Tempdirs for the CLI tests' XDG_CONFIG_HOME fixtures (Spec R03:
# `ait --init` writes under a fresh config dir). Release >=7 days old
# per ADR-0002: tempfile 3.27.0 (2026-03-11).
tempfile = "3"
# In-process SSE stub for the Spec R04 e2e tests (ticket R04-T7) —
# `ait_llm::testing`'s shared fixture server behind `test-fixtures`,
# the same harness ait-llm's contract tests and ait-agent's suggester
# tests use.
ait-llm = { path = "../ait-llm", features = ["test-fixtures"] }
# The app tests stage real store rows (conversations, transcript
# items) through `ait_store::Store` — production reaches the store
# only through `ait_app::store::StoreHandle`.
ait-store = { path = "../ait-store" }
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
# libc 0.2.191 (2026-10-16), already in the tree — the headless e2e
# `kill(SIGINT)` the driver's cancel path is proven with (Spec R11
# us-27); production signal handling lives in `ait_app::headless`.
libc = "0.2"
