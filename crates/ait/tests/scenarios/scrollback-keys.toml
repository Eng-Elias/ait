# Spec R02 stories 12-13: Shift+PageUp/PageDown page the viewport
# through scrollback, Shift+Home jumps to the oldest line, Shift+End
# returns to live, and a pass-through keypress snaps back to the bottom.
feature = "scrollback"
size = [80, 24]

[[steps]]
wait_text = "$"

[[steps]]
text = "seq 1 100\n"

# Gate on `100` as a whole output line — `wait_text "100"` would pass
# instantly on the command's own echo (`seq 1 100`) while output is
# still streaming, and scrolling mid-stream pins a partial scrollback.
[[steps]]
expect_regex = "(?m)^100$"

# Jump to the oldest scrollback line: the command's own echo.
[[steps]]
keys = ["Shift+Home"]

[[steps]]
expect_regex = "(?m)^\\$ seq 1 100$"

# Already at the top — another page up clamps (no change).
[[steps]]
keys = ["Shift+PageUp"]

[[steps]]
expect_regex = "(?m)^\\$ seq 1 100$"

# One page down = one content viewport (22 rows): `22` tops the view.
[[steps]]
keys = ["Shift+PageDown"]

[[steps]]
expect_regex = "(?m)^22$"

# Back to the live viewport.
[[steps]]
keys = ["Shift+End"]

[[steps]]
expect_regex = "(?m)^100$"

# A pass-through keypress snaps to the bottom AND reaches the shell —
# the `x` lands at the prompt.
[[steps]]
keys = ["Shift+Home"]

[[steps]]
expect_regex = "(?m)^\\$ seq 1 100$"

[[steps]]
keys = ["x"]

[[steps]]
expect_regex = "(?m)^\\$ x$"
