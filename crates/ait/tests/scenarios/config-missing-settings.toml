# Spec R03 story 6: no settings.toml on first run — the harness pins
# XDG_CONFIG_HOME to a fresh missing path, so `load()` yields built-in
# defaults silently (no error toast) and the model slot renders `—`.
feature = "Configurations and providers"
size = [80, 24]

[[steps]]
wait_text = "1:sh"

[[steps]]
expect_text = "· sh · — · running"
