# Spec R02 story 9: `Ctrl+PageDown`/`Ctrl+PageUp` cycle tabs and wrap
# around. Each tab's own marker proves which one is active.
feature = "tabs"
platforms = ["unix"]
size = [80, 24]

[[steps]]
wait_text = "$"

[[steps]]
text = "echo TAB-ONE-MARK\n"

# `^…$` — the marker as a whole output row; the typed echo carries
# `echo ` and can never satisfy the wait (std.15).
[[steps]]
expect_regex = "(?m)^TAB-ONE-MARK$"

[[steps]]
keys = ["Alt+T"]

[[steps]]
wait_text = "2:sh"

[[steps]]
text = "echo TAB-TWO-MARK\n"

[[steps]]
expect_regex = "(?m)^TAB-TWO-MARK$"

# To tab 1.
[[steps]]
keys = ["Ctrl+PageUp"]

[[steps]]
expect_regex = "(?m)^TAB-ONE-MARK$"

# Back to tab 2.
[[steps]]
keys = ["Ctrl+PageDown"]

[[steps]]
expect_regex = "(?m)^TAB-TWO-MARK$"

# `Ctrl+PageDown` wraps: tab 2 -> tab 1.
[[steps]]
keys = ["Ctrl+PageDown"]

[[steps]]
expect_regex = "(?m)^TAB-ONE-MARK$"
