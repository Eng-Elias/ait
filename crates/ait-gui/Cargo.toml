[package]
name = "ait-gui"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AIT's GUI frontend (Spec R13 §5.12): a native desktop window — eframe/egui over wgpu — rendering the same ait-app session model the TUI renders."
# cargo-dist (Spec R12 §5.11) requires the source host to compute the
# release artifact URLs for the shell installer.
repository = "https://github.com/Eng-Elias/ait"

# cargo-dist's `targets` is package-local: this list replaces the
# workspace's six for ait-gui only (Spec R13 §5.12) — glibc Linux +
# macOS on both arches + Windows MSVC (§5.14, Spec R16).
# x86_64-unknown-linux-musl stays ait-only: a fully static GUI is
# unsupportable (GPU drivers are never static).
[package.metadata.dist]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[dependencies]
# The byte-fed terminal core: `KeyEvent`/`Key`/`Modifiers` the key shim
# produces, `GridView`/`Cell`/`Style` the grid painter plans from, and
# `Size`/`Damage`/`Cursor` for layout + repaint decisions.
ait-term = { path = "../ait-term" }
# The shared session model (Spec R13-T1): `TabManager`/`Tab`/
# `SessionTemplate`, the `keymap` resolver over `CapabilityTier::Enhanced`,
# `LiveSettings`/`session_template`/`watcher`, `StoreHandle`, the picker
# states, `StatusLine`/`Toast`, scroll/selection state and the ctl server.
ait-app = { path = "../ait-app" }
# `Settings`/`load` for the live config the pump forwards and the
# `ConfigError` toast text; the `watch` feature arrives via ait-app.
ait-config = { path = "../ait-config" }
# `CommandSuggester`'s channel handle — the `# `/`Alt+Enter` NL→command
# triggers' event source (Spec R04).
ait-agent = { path = "../ait-agent" }
# Semver requirement per ADR-0002 (release >=7 days old): eframe 0.37.0
# (2026-10-15) — egui + egui-wgpu + winit arrive transitively at the same
# line; the toolkit ADR-0017 picks eframe on wgpu with the egui-wgpu
# paint-callback escape hatch reserved for the grid pass.
eframe = { version = "0.37", default-features = false, features = [
    # wgpu is the renderer (ADR-0017); x11+wayland cover the Linux legs,
    # default_fonts the bundled monospace the grid metrics derive from,
    # system_fonts the missing-glyph fallback, clipboard the OS copy/paste
    # path, accesskit the default-on a11y tree.
    "wgpu", "x11", "wayland", "default_fonts", "system_fonts",
    "clipboard", "accesskit",
] }
# The browser pane's embedded webview (Spec R14 §5.13, R14-T3; optional —
# the `web` feature): a `wry` child webview (`build_as_child`,
# repositioned over the pane rect each frame) on macOS, Linux/X11 and
# Windows (WebView2, loaded by wry at init — a missing runtime is an
# init error, not a link dep, §5.14/R16-T7).
# wry 0.57.1 (2026-10-23) — `>= 0.55` pins past the macOS-26
# `build_as_child` ObjC crash (wry#1705); 0.57.2 (2026-11-10) is
# excluded by ADR-0002's seven-day release-age rule at adoption
# (2026-11-13), and 0.57.1 is the newest compliant release. Its
# defaults keep `os-webview` (webkit2gtk/soup3 on Linux) + `x11`.
# `dpi` is wry's own `Rect` unit
# crate — `set_bounds`/`with_bounds` speak `dpi::Position`/`dpi::Size`
# (dpi 0.1.2 (2025-05-02)). `raw-window-handle` names the
# `RawWindowHandle::{Xlib,Wayland,AppKit}` variants the embed-support
# decision matches on — the ^0.6 line wry and winit 0.30 share
# (raw-window-handle 0.6.2 (2024-05-17)). All optional: feature-off
# builds carry none of them and the pane degrades to external-open.
wry = { version = "0.57.1", optional = true }
dpi = { version = "0.1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# The test-driver socket's wire codec — compiled ONLY under the
# off-by-default `test-driver` feature (Spec R15): release binaries
# carry none of it. Semver requirements per ADR-0002, the same lines
# ait-testkit resolves: serde 1.0.229 (2026-07-18), serde_json
# 1.0.154 (2026-10-11).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The `screenshot` verb's PNG encoder (Spec R15): `ViewportCommand::
# Screenshot` hands back a `ColorImage` whose RGBA bytes `png` writes
# to the harness's evidence dir — evidence for humans, never a
# pixel-diff gate. Semver per ADR-0002: png 0.18.1 (2026-02-14),
# already resolved in the tree via eframe's `image` dep.
png = { version = "0.18", optional = true }

# Linux-only webview runtime glue (Spec R14 §5.13, R14-T3): wry's
# `build_as_child` panics unless `gtk::init` ran on the creating
# thread, and the webview needs the glib main context pumped alongside
# the frame loop. The `0.18` line is the one wry's `os-webview` feature
# pulls itself, so the tree carries ONE gtk (gtk 0.18.2 (2024-12-09)).
# macOS needs nothing — WKWebView is a system framework — and Windows
# needs nothing either: wry loads WebView2 at init (§5.14/R16-T7).
# The target gate keeps `gtk` out of the Windows tree while the `web`
# feature's `dep:gtk` entry still resolves there (a target-gated
# optional dep is simply absent on other targets — verified by
# `cargo tree --target x86_64-pc-windows-msvc`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
# `web` (default): the browser pane embeds a `wry` child webview where
# the platform supports it (Spec R14 §5.13). `--no-default-features`
# drops the whole webkit stack — the pane then shows the
# external-open surface only, and the build needs no webkit2gtk/gtk
# system packages.
default = ["web"]
web = ["dep:wry", "dep:dpi", "dep:raw-window-handle", "dep:gtk"]
# `test-driver` (off by default, Spec R15): the test-only injection/
# dump socket beside ctl, bound only when AIT_TEST_DRIVER_SOCKET names
# its path. Release artifacts never see it — cargo-dist builds default
# features, and the code compiles out without it.
test-driver = ["dep:serde", "dep:serde_json", "dep:png"]

[dev-dependencies]
# Tempdirs for the pump tests' store database and settings-watcher
# fixtures. Release >=7 days old per ADR-0002: tempfile 3.27.0
# (2026-03-11), already in the tree.
tempfile = "3"
# The pump tests inject a real tempdir `Store` through
# `StoreHandle::from_store` and read persisted session/block rows back
# with a second connection — production reaches the store only through
# `ait_app::store::StoreHandle`.
ait-store = { path = "../ait-store" }
# The GUI e2e harness (Spec R15): `GuiE2e` spawns the real `ait-gui`
# binary under a display and drives it over the test-driver socket;
# the TOML scenarios live in tests/scenarios/.
ait-testkit = { path = "../ait-testkit" }
# `ait_llm::testing`'s scripted loopback server (Spec R15-T6): the
# suggestion-trigger e2e points `command_model` at `Fixture`'s
# drip-fed SSE stream so the in-flight `suggesting` window is a
# deterministic hold, not a race — no real provider anywhere.
ait-llm = { path = "../ait-llm", features = ["test-fixtures"] }
