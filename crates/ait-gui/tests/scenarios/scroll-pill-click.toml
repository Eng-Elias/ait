# Spec R15-T3 — the scroll-to-bottom `⤓` pill clicked by pointer:
# it registers as `pill.scroll_bottom` only while the view is
# scrolled back (its paint condition IS `scroll_offset > 0`), so the
# named click both proves the pill painted and drives its snap to
# the live output.
feature = "scroll"

[[steps]]
wait_text = "$"

# Fill scrollback — 200 rows well past the viewport, prefixed so the
# probe can't be satisfied by the command's own echo (std.15).
[[steps]]
text = "seq 1 200 | sed 's/^/X/'"

[[steps]]
key = "Enter"

[[steps]]
wait_text = "X200"

# Scroll back — the pill paints (and registers) from here on.
[[steps]]
scroll = { unit = "line", dy = 3.0 }

[[steps]]
expect_scroll = 3

# The pill registers on the paint its scroll condition earns —
# `expect_scroll` sees the model offset a pass early, so the named
# click gates on the registry too.
[[steps]]
expect_hit = "pill.scroll_bottom"

# The click IS the pill assertion — an unregistered name would fail
# the step listing the registry; the hit lands through egui's own
# button hit-test and snaps the view to the live bottom.
[[steps]]
click = "pill.scroll_bottom"

[[steps]]
expect_scroll = 0

[[steps]]
quit = true
