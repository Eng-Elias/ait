[workspace]
resolver = "2"
members = ["crates/*"]

# Single version for the whole workspace (Spec R12 us-24): every crate
# inherits via `version.workspace = true` so `ait --version`, the release
# tag and the CHANGELOG top entry can never drift apart by accident.
[workspace.package]
version = "1.0.0"

# cargo-dist release pipeline (Spec R12 §5.11): pushing a version tag
# builds archives for the six §6 targets plus the `ait-installer.sh`
# curl|sh and `ait-installer.ps1` PowerShell installers, publishes the
# GitHub Release, and announces only after the verify-install gate
# passes. The generated
# .github/workflows/release.yml is refreshed by `dist generate` —
# never hand-edit it (dist errors on a stale generated file).
[workspace.metadata.dist]
# The exact dist release CI installs — ADR-0002's determinism rule
# applied to the release toolchain. release.yml's "Install dist" step
# curls this version's installer.
cargo-dist-version = "0.34.0"
ci = ["github"]
# `ait` and `ait-gui` are the workspace's two [[bin]]s (Spec R13 §5.12)
# — the ait-llm `chat` example and ait-testkit are never release
# artifacts.
packages = ["ait", "ait-gui"]
# §5.11 ships the curl|sh installer; §5.14 (Spec R16) adds the
# PowerShell twin dist emits as `ait-installer.ps1` /
# `ait-gui-installer.ps1` for Windows users. No homebrew/npm/msi.
installers = ["shell", "powershell"]
# gzip archives (ait-<target>.tar.gz): decompresses everywhere the
# installer runs with no extra tooling; dist's default is .tar.xz.
unix-archive = ".tar.gz"
# x86_64-musl is the fully static leg (the dep tree is rustls-only, no
# OpenSSL — Spec R12); aarch64-linux builds natively on the ARM64
# runner below rather than dist's cargo-zigbuild cross default.
# x86_64-pc-windows-msvc joins in Round 16 (§5.14); aarch64-windows
# stays skipped — §5.14 marks it optional, there's no free native
# runner, and nothing could test it.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# "skip" removes the pull_request trigger dist would otherwise emit —
# a dist dry-run on every PR would bill private-repo minutes on `dev`
# PRs, and our CI policy is main-only (AGENTS.md).
pr-run-mode = "skip"
# Guard the pipeline start (tagged commit on main + version agreement,
# spec us-26/27) and gate `announce` on a smoke test of the published
# installer — the two supported injection points. The verify-install
# reusable workflow is owned by R12-T5.
plan-jobs = ["./guard"]
publish-jobs = ["./verify-install"]

# The musl leg's generated "Install dependencies" step runs
# `apt-get install musl-tools` through apt sources on *.ubuntu.com —
# every such host flaked DNS at once and killed the v1.0.0 tag build
# twice in a row. dist splices this file's steps in right after
# checkout — before that step — so it can repoint apt at kernel.org's
# mirror (scripts/fix-apt-mirror.sh) and pre-install the packages,
# turning dist's own apt call into a no-op.
github-build-setup = "../build-setup.yml"

# publish-jobs default to escalated id-token/packages permissions; the
# verifier only reads release assets, so pin it to contents:read.
[workspace.metadata.dist.github-custom-job-permissions.verify-install]
contents = "read"

# GitHub's native ARM64 label — free on public repos, and the repo goes
# public before the first tag (Spec R12).
[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
